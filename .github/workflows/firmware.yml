# Builds the firmware in the cloud on every push to main and puts it into the panel (docs/firmware/firmware.js),
# so the panel on GitHub Pages flashes this fork's build. Nothing to install on the computer.
name: firmware
on:
  push:
    branches: [main]
    paths-ignore: [docs/firmware/firmware.js]
  workflow_dispatch:
permissions:
  contents: write
concurrency: firmware
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5 # the version firmware/dependencies.lock was solved with
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and pack for the panel
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          sed -i 's|^source ~/esp/esp-idf/export.sh.*$|true|' tools/release.sh
          bash tools/release.sh || { grep -h -B3 -A8 -E 'error:|undefined reference' firmware/build-release/log/idf_py_std*_output_* | head -200; exit 1; } # release.sh hides the compiler's output
      - name: Commit the firmware into the panel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/firmware.js
          git diff --cached --quiet || git commit -m "Прошивка для панели: $(git rev-parse --short HEAD)"
          git push
